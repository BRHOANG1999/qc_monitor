watch:
  paths:
  # As close to the SMB server root as Windows allows -- the literal share
  # root cannot be enumerated. We list every share with session data; the
  # watcher recurses from each and OSError-skips $RECYCLE.BIN and
  # System Volume Information automatically. The two shares overlap on
  # recent sessions; main.py dedups overlapping content by
  # (basename, size, mtime) so nothing gets processed twice.
  - //100.106.104.22/database/
  - //100.106.104.22/bhz/
  poll_interval_sec: 30
  min_file_age_sec: 60
channel_mapping:
  auto_discover: true
epoch_extraction:
  pre_stimulus_ms: -100.0
  post_stimulus_ms: 500.0
  stimulus_threshold_std: 3.0
  min_stimulus_distance_sec: 0.1
  # Lower bound on stim-copy peak-to-peak / robust-noise ratio. Below this,
  # the stim channel is assumed to be pure noise and detection is skipped.
  # Lower for low-charge protocols (e.g. 5 nC) where the stim copy is small.
  stim_peak_ratio_min: 4.0
  baseline_correction: true
  baseline_start_ms: -60.0
  baseline_end_ms: -10.0
  highpass_enabled: false
  highpass_cutoff_hz: 1.0
  highpass_order: 4
  lowpass_enabled: false
  lowpass_cutoff_hz: 1000.0
  lowpass_order: 4
  notch_50hz: false
  notch_60hz: true
feature_analysis:
  window_start_ms: 1.0
  window_end_ms: 200.0
  stim_artifact_start_ms: -5.0
  stim_artifact_end_ms: 15.0
  bandpass_enabled: false
  bandpass_highpass_hz: 1.0
  bandpass_lowpass_hz: 100.0
  notch_enabled: true
  notch_frequency_hz: 60.0
  smoothing_enabled: true
  smoothing_window_ms: 2.0
  baseline_correction: true
  artifact_exclusion_enabled: false
  artifact_method: fixed
  artifact_threshold: 500.0
  artifact_merge_gap_sec: 2.0
  template_source: early50ms
  template_upper_r: 0.7
  template_lower_r: 0.3
  rawamp_multiplier: 4.0
  noise_neg_threshold: 0
  noise_pos_threshold: 0
  noise_glue_window_sec: 1.0
  ictal_rescue_enabled: false
  ictal_rescue_window_ms: 500.0
  early_area_start_ms: 0.0
  early_area_end_ms: 50.0
  late_area_start_ms: 50.0
  late_area_end_ms: 200.0
  analysis_start_ms: 2.0
  analysis_end_ms: 200.0
criticality:
  ar_order: 5
  window_sec: 2.0
  overlap_pct: 50
  fit_method: YuleWalker
  target_sampling_rate: 1000
  criticality_type_b: 2
  calculate_error_bars: false
seizure:
  spike_threshold_uv: 10.0
  spike_min_width: 5
  spike_max_width: 50
  min_seizure_duration_sec: 5.0
  event_glue_sec: 2.0
  min_spikes_per_sec: 2.0
  outlier_factor: 3.0
artifact:
  method: fixed
  fixed_threshold: 500.0
  mad_k: 4.0
  merge_gap_sec: 2.0
qc_thresholds:
  artifact_pct_warning: 50.0
  flatline_std: 1.0e-06
  clipping_voltage: 10.0
  line_noise_ratio_warning: 0.2
features:
  enabled:
  - Line Length
  - Log(AUC)
  - Peak Amplitude
  - Trough Amplitude
  - Peak-to-Trough
  - RMS Amplitude
  - Peak Latency
  - Trough Latency
  - Max Slope
  - Max Slope Time
  - Early Area
  - Late Area
  - Early/Late Ratio
  - Recovery Tau
  - Recovery Slope
  - Template Correlation
  - PCA Recon Error
  - Variance
  - Autocorrelation
  - AC Width
  - Rolling Variance
  - Rolling AR(1)
  - Rolling CV
  - Exp Fit A
  - Sum Power Low
  - Freq Moment Low
  - Sum Power High
  - Freq Moment High
stimnet_root: D:/code/Stimulation-Telemetry-Modulation-NeuroEngineering-Toolkit/daqSignalGenerator
matlab_exe: matlab
alerting:
  enabled: true
  smtp:
    server: smtp.gmail.com
    port: 587
    from_email: underflowbot@gmail.com
    password_env_var: QC_MONITOR_EMAIL_PASSWORD
    recipients:
    - hoang392@umn.edu
  rules:
    network_down_minutes: 5
    no_data_hours: 2
    artifact_pct_warning: 50
    seizure_warning: true
    stim_delivery_failure: true
    rate_limit_per_type_minutes: 60
dashboard:
  host: 0.0.0.0
  port: 8050
  refresh_interval_sec: 10
auth:
  # Identity gate for the dashboard. Cloudflare Access sits in front of
  # the Cloudflare Tunnel and performs SSO; this app verifies the JWT
  # Cloudflare injects so that only authenticated users can read or
  # write data. See docs/REMOTE_ACCESS.md for the operator runbook.
  enabled: true
  cf_team_domain: ''                 # e.g. yourteam.cloudflareaccess.com (required in prod)
  cf_audience: ''                    # AUD tag from the Access app (required in prod)
  dev_bypass: true                   # local-dev only; flip to false once cloudflared is in front
  dev_bypass_email: hoang392@umn.edu
surgeries:
  # Renders "today's pre-op / surgery / post-op tasks" pulled from
  # Google Sheets. Two auth paths supported per-sheet:
  #
  # (a) Service account (private sheets, recommended) -- set
  #     service_account_file below, share each sheet with the SA's
  #     email as Viewer, then list sheets by sheet_id + tab_name.
  #     See docs/SHEETS_SERVICE_ACCOUNT.md.
  #
  # (b) Published CSV -- File > Share > Publish to web > CSV, paste
  #     the /pub?output=csv URL. No GCP setup but the URL is readable
  #     by anyone who has it.
  enabled: true                 # tab renders empty until sheets are listed
  refresh_minutes: 10
  implant_keywords: ["implant", "headstage", "headcap"]
  service_account_file: secrets/sheet-sync-473717-fb1897b8f02f.json
  sheets:
    - label: "Injection/Implant Log"
      sheet_id: "17fm0UnfT2xd2C3FKbB5U_rlh1qt3gMaVBktyJgD6P1E"
      tab_name: "BCH Log"
      header_row: 2              # banded headers: row 1 is group labels
      date_columns:
        - name: "Date of Injection"
          is_implant: false
          event_label: "Injection"
        - name: "Date of Implant"
          is_implant: true
          event_label: "Implant"
  # KM Lab Mice (tab "JAX Cages") is a cage roster, not a surgery log
  # (grant labels + locations in non-tabular form). Not included here.
  #  # Published-CSV path (works without GCP setup, URL is a low-grade secret)
  #  - label: "Public log"
  #    url: "https://docs.google.com/spreadsheets/d/e/<KEY>/pub?output=csv&gid=919387434"
  # column_aliases:               # optional -- extends the defaults
  #   animal_id:    ["Animal", "Animal #"]
  #   surgery_date: ["Date", "Surgery date"]
  #   surgery_type: ["Type", "Procedure"]
  #   notes:        ["Comments"]
database:
  path: D:/code/qc_monitor/data/monitor.db
logging:
  level: INFO
  dir: D:/code/qc_monitor/logs
  max_file_size_mb: 10
  max_files: 5
