  service_account_file: secrets/sheet-sync-473717-fb1897b8f02f.json
  sheet_id: 1a7E0t_Go3IXUpJj0AFfq2KSlXkjMrw1KZa1GdIWnoe0
  tab_name: File_Records
notifications:
  state_file: data/notification_state.json
  eod_digest:
    enabled: true
    hour: 18
  video_weekly:
    enabled: true
    weekday: 0
    hour: 8
  evoked_weekly:
    enabled: true
    weekday: 6
    hour: 8
    drift_threshold_pct: 30.0
  queue_watch:
    enabled: true
    min_pending: 100
    stall_minutes: 60
  # Pre-ictal daily digest: summarizes the last completed DAILY sweep (which CWT
  # time-scales survive the surrogate null). The weekly/monthly digests + the
  # scheduler ticks that ENQUEUE the sweeps land in stage 3.
  preictal_daily:
    enabled: true
    hour: 20
  # Coverage monitor: daily scan for recordings that fell through the cracks --
  # evoked *_evoked.mat with no feature sidecar (the gap that starved the evoked
  # figures) + processed_files pipeline stalls. Silent on a healthy day. Only
  # counts an evoked recording as a real gap once it's been unanalyzed longer
  # than stale_hours (fresh arrivals are a healthy backlog, not a failure).
  # allowlist: substrings (animal ids / path fragments) whose gaps are expected.
  coverage_digest:
    enabled: true
    hour: 8
    stale_hours: 48
    allowlist: []
  # Weekly stimulus-stability report (Sunday). Per stimulated channel on the rig
  # it renders average-stim waveform PNGs (per file/day/week), the
  # access-resistance (Ra) drift figure, and a stim-vs-evoked (1-50 ms)
  # correlation scatter; uploads them to a Shared Drive; keeps a running "Stim
  # Stability" sheet (one row per week per channel, =IMAGE thumbnails + folder
  # link); and emails the headline figures. Requires the Drive API enabled + a
  # Shared Drive folder shared with the service account (see google_drive below).
  # Ships DISABLED -- dry-run first:
  #   python -m src.notifications.stim_stability_weekly --dry-run
  stim_stability_weekly:
    enabled: false
    weekday: 6              # 0=Mon .. 6=Sun
    hour: 8
    recipients: []          # falls back to alerting.smtp.recipients
    sheet_id: ""            # falls back to google_sheets.spreadsheet_id
    tab_name: Stim Stability
    exclude: [Randles]      # calibration phantom
    drift_threshold_pct: 40
    baseline_weeks: 10      # rolling-median window for the Ra baseline
    min_history: 4
    perfile_span: last_day  # last_day (~24 PNGs/ch) | week (all ~168)
    upload_throttle_sec: 0.1
    # stim_window_ms: [-1, 10]   # optional; default = full trace for stim p2p
review_queue:
  # Per-undergrad behavioral review queue. Pulls a list of
  # unreviewed recordings for the user's assigned animals from
  # session_config, surfaces them in the Video Review tab, and
  # records what was marked done by whom.
  enabled: true
  pi_emails:
    - hoang392@umn.edu
  assignments:
    # Reuses the KMrecorder Data Log sheet (data_log_xref.sheet_id)
    # in a new tab. PI edits Animal_ID + User_Email + Active rows;
    # dashboard re-reads every refresh_minutes minutes via the
    # shared Google Sheets API client.
    sheet_id: "1a7E0t_Go3IXUpJj0AFfq2KSlXkjMrw1KZa1GdIWnoe0"
    tab_name: "Reviewer Assignments"
    service_account_file: secrets/sheet-sync-473717-fb1897b8f02f.json
    # The background warmer in src/utils/assignments.py refreshes
    # this cache on its own clock, and the floating Refresh button
    # forces an immediate re-read, so a longer TTL is safe -- it
    # just bounds how stale a brand-new assignment looks to a
    # reviewer who doesn't click Refresh.
    refresh_minutes: 30
  queue:
    # Hard cap on queue length per user/animal so the UI stays
    # snappy even when there's a multi-thousand-file backlog.
    max_per_view: 100
    # Backlog warning thresholds used by the PI tab + digest.
    warn_age_days: 3
    crit_age_days: 7
  weekly_digest:
    # PI summary fired by the existing DigestScheduler.
    enabled: true
    weekday: 4   # 0=Mon ... 4=Fri
    hour: 17

# Automatic per-animal review-queue filter. A background sweep (rides the
# mass_analyze worker) screens each enabled animal's pending files; a file
# crossing NONE of that animal's active thresholds is auto-marked
# pending_pi_review (the PI still rubber-stamps it into the CSV no-event path).
# Thresholds are set per animal in the Event Verification tab (Auto-filter
# panel). Reuses the feature_analysis stim-blank window + the 150s min peak
# distance from the Mass Analyze screen.
auto_filter:
  enabled: true
  sweep_interval_sec: 300
  # Author attributed to the automated auto-screen sweep + its flag/clear
  # review events. Keep this a SYSTEM identity (not a person) so the
  # auto-screen doesn't show up as a human in the User Activity feed.
  system_email: auto-filter@system

# Training tab: students blind-re-score PI-approved recordings and get an
# agreement score vs the validated answer. Reuses review_queue.pi_emails
# for the PI roster / advance gate.
training:
  # Rolling pass bar: a student is flagged "ready to advance" when the
  # mean agreement over their last `window` graded attempts in the
  # current stage is >= pass_pct. The PI still confirms the advance.
  pass_pct: 85
  window: 10
  # Strictness of agreement (Stages 2-3): how close a student's onset must
  # be to count as the same event / landmark, and the Racine slack.
  onset_tol_s: 10
  racine_tol: 1
  # Examples per balanced round. Stage 1 is split 50/50 no-seizure /
  # seizure; stage 2 even Racine + 50/50 LVF/HYP; stage 3 spread across
  # animals. After each round the student gets a confidence prompt.
  examples_per_round: 10
  # Recordings shorter than this (seconds) are never shown as practice
  # examples. Files whose length isn't known yet (imported historical files)
  # are kept until their length is measured the first time they're opened.
  min_file_duration_sec: 1800

# Historical scored-event practice library for the Training tab. Reads the
# lab's BHZ CSV exports (bhz_csv.base_dir) -- the same files the MATLAB BHZ
# Review Workstation browses -- keeps the confirmed seizures (Peak_Index set,
# Score > 0), dedupes, and resolves each event's EEG recording on disk via
# the same cascade the toolkit uses (folder/filename -> +.mat -> recursive
# search), extended to walk the share roots + every mounted drive. Resolved
# files become extra Training examples whose validated answer is the lab's
# own score. See src/utils/past_events.py. Triggered from a button in the
# Training tab (never auto-scans on tab open).
past_events:
  enabled: true
  # Recursive-search roots used when a recording isn't at its CSV folder
  # path. Empty -> falls back to watch.paths. auto_drives additionally walks
  # every mounted fixed drive (D:, G:, I:, U: ...) for files moved to a
  # local HDD; system folders are skipped and a per-drive dir cap bounds it.
  search_roots: []
  auto_drives: true
  max_search_dirs: 200000

# Slow-gamma (30-50 Hz) induced-power feature in Video Review. Windows are
# milliseconds relative to each stim onset. The post window starts AFTER the
# evoked transient (~first tens of ms) so it measures an oscillation, not the
# spectral leakage of the evoked deflection; pre is the ongoing baseline.
slow_gamma:
  pre_ms: [-200, -2]
  post_ms: [50, 200]

# Chronic Evoked Analyzer tab: reads one implanted animal's full evoked
# history (per stimulus) from the MATLAB toolkit's evokedOutput folder.
# Features are computed once per recording and stored as JSON sidecars next to
# each *_evoked.mat (no database); later reads are instant. evoked_output_dir
# defaults to <stimnet_root>/evokedOutput.
overview:
  # Subjects to omit from the behavioral-seizure status card
  # (case-insensitive substring match). 'Randles' is a non-experimental
  # subject. Defaults to ["Randles"] even if this key is absent.
  exclude_animals:
    - Randles
  # Default count for the "Recent recordings" evoked overlay (the N input
  # on the card overrides it live). Default 24 if absent.
  hist_recordings: 24
  # Last-good card snapshots (stale-while-revalidate). The expensive Overview
  # cards (behavioral-seizure status, Google-Sheets home grid + KM log) pickle
  # their last render to the DB and repaint it INSTANTLY on the first open after
  # a daemon restart, then revalidate in the background -- so a restart no longer
  # drops everyone back to a cold rebuild. Pure cache; safe to disable.
  snapshot_enabled: true
  # Don't paint a restored card older than this on boot (the background warmer
  # replaces it within seconds regardless). Default 1440 min (24 h).
  snapshot_max_age_min: 1440
  # Rebuild every expensive card in a background thread at daemon start so the
  # first user never pays the cold build. Default true.
  warm_on_boot: true
chronic_evoked:
  evoked_output_dir: D:/code/Stimulation-Telemetry-Modulation-NeuroEngineering-Toolkit/daqSignalGenerator/evokedOutput
  # Compute the heavy per-epoch features (recovery tau/slope, template
  # correlation, PCA recon error, AC width, exp-fit A). Off = the cheap
  # vectorized features only. To enable: set true AND rebuild the sidecars with
  # `python tools/warm_evoked_cache.py --expensive`.
  compute_expensive: false
  # Background sidecar builder. Sidecars used to be created only when someone
  # opened this tab, so new recordings accumulated without features forever
  # (the coverage monitor's "evoked recordings unanalyzed" gap). This fills
  # them a few at a time, newest recordings first.
  sidecar_warm:
    enabled: true
    # Cadence auto-tunes to where evoked_output_dir lives (see _path_is_local):
    #   LOCAL fixed disk  -> brisk (batch 20 / 60 s idle), near-continuous;
    #   network share/UNC -> gentle (batch 4 / 300 s idle) so a multi-GB SMB
    #                        read never starves the UI or the analysis sweeps.
    # It stays SERIAL either way (one recording in memory at a time). Uncomment
    # to pin an explicit cadence that overrides the auto choice:
    # interval_sec: 300
    # batch: 4
    # Older-schema sidecars are still READ fine (new columns come back NaN),
    # so re-computing them is optional. Turn on to backfill the newer feature
    # columns across the archive.
    upgrade_outdated: false
  # "Configure" defaults (the analyzer's processing panel; mirrors the MATLAB
  # ChronicTabController config dialog / ChronicTabState defaults). These seed
  # the in-tab controls; features are recomputed from the raw epoch traces
  # when the user changes any of them. window_*_ms null = use the full
  # extracted window (the toolkit's traces are already filtered + baseline-
  # corrected, so the defaults are a pass-through = today's behavior).
  configure:
    window_start_ms: null
    window_end_ms: null
    bandpass: false
    bp_low_hz: 1.0
    bp_high_hz: 100.0
    notch: false
    notch_hz: 60.0
    smoothing: false
    smooth_ms: 5.0
    baseline: false

# Event-clip extractor (ffmpeg) for the PI verification flow.
# Builds a stitched 10+ min clip (5 min before EO to 5 min
# after BB) for every event the PI opens for detail review.
# Stream-copy by default for speed; falls back to libx264
# re-encode when keyframe alignment breaks the copy.
event_clip:
  enabled: true
  cache_dir: secrets/event_clip_cache
  cache_max_gb: 5
  ffmpeg_bin: ffmpeg
  fallback_to_reencode: true

# On-demand .avi -> mp4 transcoding so the Training tab can play the lab's
# behavioral videos (which ship as .avi, unplayable in a browser). Stream-
# copies an H.264 .avi into mp4 (fast) or re-encodes to H.264, caching the
# result. Reuses event_clip.ffmpeg_bin. See src/utils/avi_transcode.py.
video_transcode:
  enabled: true
  cache_dir: secrets/avi_mp4_cache
  cache_max_gb: 10
  reencode_timeout_sec: 1800
  # The lab's behavioral cameras record at ~5 fps but the .avi container
  # usually MISREPORTS the rate, so the video plays at the wrong speed and
  # the LFP cursor-sync drifts. Reinterpret every transcode at this rate
  # (re-encode; stream-copy can't retime). 0/null = trust the .avi metadata.
  force_fps: 5

# BHZ_DETECTOR-compatible CSV export. Each completed Mark-done
# in Video Review appends rows here so the lab's downstream
# MATLAB pipelines see the same 44-column schema they always
# have. See src/utils/bhz_csv.py for the encoding contract.
bhz_csv:
  enabled: true
  base_dir: "G:\\BHZ\\BHZ_CSV_Exports"
  filename_template: "{date}_{animal}.csv"
  append: true
  # Periodically export "Needs more onsets" (needs_scoring) events to the day
  # CSVs. Those files never reach the PI approval gate, and onsets saved by the
  # 4-second autosave bypass the Submit path that exports inline -- without
  # this they'd stay in the DB only. Idempotent (dedup by EventEO), so it is a
  # no-op once everything is written, and it retries a CSV that was momentarily
  # locked (e.g. open in Excel).
  auto_flush_enabled: true
  auto_flush_interval_sec: 600

# Google-Sheet sync into "BHZ Analysis Log". Each animal gets TWO tabs:
#   "<MouseID> Daily"  -- one row PER DAY (the rollup summary)
#   "<MouseID> Events" -- one row PER SEIZURE EVENT (the detail)
# Update is a MERGE -- only the columns we compute are written; the
# lab's hand-filled columns (Recording Location, etc.) are left intact.
# PRECONDITION: the spreadsheet is shared (Editor) with the
# service-account email + the Sheets API is enabled for its project.
# Auto-maps these stat keys onto the tab header by name:
#   date, animal (MouseID), csv_filename (CSV File Name),
#   n_events (Number of Behavioral Events), n_pending_events (Events
#   Needing Onsets), reviewers (Who Completed Analysis), max_racine,
#   n_during_stim_events, n_files, ...
# A missing animal tab is CREATED (create_missing_tabs) and the tab order
# is re-asserted afterwards, so the tab bar follows a flow, not creation
# order. Run tools/sheets_reorganize.py to re-assert it by hand.
google_sheets:
  enabled: true
  service_account_file: secrets/sheet-sync-473717-fb1897b8f02f.json
  spreadsheet_id: 1HwQlqGPERHCOVUcJDzv8yMm-vZzjqfsh25ud7rfWes8
  key_columns: [Date]   # one row per day within each animal's tab
  # Optional explicit header->stat-key overrides, e.g.
  #   {"Channel(s)": "channels", "Type of Recording": "n_during_stim_events"}
  column_map: {}
  # Auto-push scored seizures the moment the PI approves (not only on the
  # manual "Finalize -> CSV" button). Set false to keep it finalize-only.
  push_on_approve: true
  # Per-animal summary tab: "<MouseID> Daily" (one row per day). Blank ""
  # means the tab is titled the bare MouseID (the pre-2026-07 layout).
  summary_tab_suffix: " Daily"
  # Column holding the count of events still in the "Needs more onsets"
  # pool for that day -- kept OUT of "Number of Behavioral Events" so that
  # column stays a clean APPROVED tally. Added to a tab if absent.
  summary_pending_column: "Events Needing Onsets"
  # Per-animal "<MouseID> Events" tab (auto-created): one row per seizure
  # event (Date | Onset (clock) | Racine | Type | Light | File | Status).
  events_tab_suffix: " Events"
  events_key_columns: ["File", "Onset (clock)"]
  # Auto-create a NEW animal's summary tab (header copied from an existing
  # animal tab) instead of skipping it -- so a new subject gets its own tab.
  create_missing_tabs: true
  # Optional: tab whose header is copied for new animal tabs. Blank =
  # auto-detect (first existing summary tab with a Date column).
  summary_template_tab: ""

# Google Drive target for the weekly stimulus-stability figures. Two auth modes:
#   auth_mode: oauth           -> upload into a PERSONAL Google Drive AS YOU (no
#                                 Workspace needed; files count against your 15GB).
#                                 One-time consent on a machine with a browser:
#                                   python -m src.utils.drive_upload --authorize
#                                 then set folder_id to a folder id in your Drive.
#                                 Publish the OAuth consent screen to "In
#                                 production" or the token expires after 7 days.
#   auth_mode: service_account -> upload into a Workspace SHARED DRIVE (a bare
#                                 service account has no personal-Drive quota, so
#                                 it CANNOT use a normal My-Drive folder).
# Leave folder_id blank to skip Drive upload entirely -- the figures still go out
# as email attachments regardless (Drive is optional).
google_drive:
  auth_mode: oauth
  # -- oauth (personal Drive) --
  oauth_client_file: secrets/drive_oauth_client.json   # downloaded Desktop-app OAuth client
  token_file: secrets/drive_oauth_token.json           # written by --authorize
  folder_id: ""                                        # a folder id in YOUR Drive
  # -- service_account (Workspace Shared Drive) --
  service_account_file: secrets/sheet-sync-473717-fb1897b8f02f.json
