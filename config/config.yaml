  - Log(AUC)
  - Peak Amplitude
  - Trough Amplitude
  - Peak-to-Trough
  - RMS Amplitude
  - Peak Latency
  - Trough Latency
  - Max Slope
  - Max Slope Time
  - Early Area
  - Late Area
  - Early/Late Ratio
  - Recovery Tau
  - Recovery Slope
  - Template Correlation
  - PCA Recon Error
  - Variance
  - Autocorrelation
  - AC Width
  - Rolling Variance
  - Rolling AR(1)
  - Rolling CV
  - Exp Fit A
  - Sum Power Low
  - Freq Moment Low
  - Sum Power High
  - Freq Moment High
