watch:
  paths:
  - //100.106.104.22/database/
  - //100.106.104.22/bhz/
  poll_interval_sec: 30
  min_file_age_sec: 60
channel_mapping:
  auto_discover: true
epoch_extraction:
  pre_stimulus_ms: -500.0
  post_stimulus_ms: 500.0
  stimulus_threshold_std: 3.0
  min_stimulus_distance_sec: 0.1
  stim_peak_ratio_min: 4.0
  baseline_correction: true
  baseline_start_ms: -100.0
  baseline_end_ms: -10.0
  highpass_enabled: false
  highpass_cutoff_hz: 1.0
  highpass_order: 4
  lowpass_enabled: false
  lowpass_cutoff_hz: 1000.0
  lowpass_order: 4
  notch_50hz: false
  notch_60hz: false
feature_analysis:
  window_start_ms: 1.0
  window_end_ms: 200.0
  stim_artifact_start_ms: -5.0
  stim_artifact_end_ms: 15.0
  bandpass_enabled: false
  bandpass_highpass_hz: 1.0
  bandpass_lowpass_hz: 100.0
  notch_enabled: true
  notch_frequency_hz: 60.0
  smoothing_enabled: true
  smoothing_window_ms: 2.0
  baseline_correction: true
  artifact_exclusion_enabled: false
  artifact_method: fixed
  artifact_threshold: 500.0
  artifact_merge_gap_sec: 2.0
  template_source: early50ms
  template_upper_r: 0.7
  template_lower_r: 0.3
  rawamp_multiplier: 4.0
  noise_neg_threshold: 0
  noise_pos_threshold: 0
  noise_glue_window_sec: 1.0
  ictal_rescue_enabled: false
  ictal_rescue_window_ms: 500.0
  early_area_start_ms: 0.0
  early_area_end_ms: 50.0
  late_area_start_ms: 50.0
  late_area_end_ms: 200.0
  analysis_start_ms: 2.0
  analysis_end_ms: 200.0
criticality:
  ar_order: 5
  window_sec: 2.0
  overlap_pct: 50
  fit_method: YuleWalker
  target_sampling_rate: 1000
  criticality_type_b: 2
  calculate_error_bars: false
seizure:
  spike_threshold_uv: 10.0
  spike_min_width: 5
  spike_max_width: 50
  min_seizure_duration_sec: 5.0
  event_glue_sec: 2.0
  min_spikes_per_sec: 2.0
  outlier_factor: 3.0
artifact:
  method: fixed
  fixed_threshold: 500.0
  mad_k: 4.0
  merge_gap_sec: 2.0
# Tier-1 wavelet band power (Morlet CWT). The heaviest per-file analyzer
# (per-channel CWT on a centre window) -- set enabled:false to skip it.
wavelet_qc:
  enabled: true
video_qc:
  enabled: true
  alert_on_critical: true
  sample_every_n: null
  downsample_to:
  - 160
  - 120
  min_mean: 25.0
  max_mean: 230.0
  min_variance: 50.0
  alert_pct_bad: 25.0
qc_thresholds:
  artifact_pct_warning: 50.0
  flatline_std: 1.0e-06
  clipping_voltage: 10.0
  line_noise_ratio_warning: 0.2
features:
  enabled:
  - Line Length
  - Log(AUC)
  - Peak Amplitude
  - Trough Amplitude
  - Peak-to-Trough
  - RMS Amplitude
  - Peak Latency
  - Trough Latency
  - Max Slope
  - Max Slope Time
  - Early Area
  - Late Area
  - Early/Late Ratio
  - Recovery Tau
  - Recovery Slope
  - Template Correlation
  - PCA Recon Error
  - Variance
  - Autocorrelation
  - AC Width
  - Rolling Variance
  - Rolling AR(1)
  - Rolling CV
  - Exp Fit A
  - Sum Power Low
  - Freq Moment Low
  - Sum Power High
  - Freq Moment High
stimnet_root: D:/code/Stimulation-Telemetry-Modulation-NeuroEngineering-Toolkit/daqSignalGenerator
matlab_exe: matlab
# Hard cap for one file's Tier-2 MATLAB run. A 1-hour, 500+ MB recording
# loaded over the network + evoked extraction + 25 features + wavelet CWT can
# take 5-15 min; 300s used to time out and false-flag them as matlab_error.
matlab_timeout_sec: 1200
alerting:
  enabled: true
  smtp:
    server: smtp.gmail.com
    port: 587
    from_email: kmrecorder.alert@gmail.com
    password_env_var: QC_MONITOR_EMAIL_PASSWORD
    password_file: secrets/smtp_password.txt
    recipients:
    - hoang392@umn.edu
  rules:
    network_down_minutes: 5
    no_data_hours: 2
    artifact_pct_warning: 50
    seizure_warning: true
    stim_delivery_failure: true
    rate_limit_per_type_minutes: 60
    # Transfer-impedance drift: warn when a channel's per-phase impedance
    # moves more than impedance_shift_pct from its rolling-median baseline
    # (last impedance_baseline_window recordings); critical past
    # impedance_shift_pct_critical. Needs >= impedance_min_history points.
    impedance_shift_pct: 40
    impedance_shift_pct_critical: 75
    impedance_baseline_window: 10
    impedance_min_history: 4
    # Current-delivery fidelity (two-edge ratio, impedance-invariant): warn
    # when a channel's rolling-median fidelity drops below current_sag_pct
    # (negative) -- the reversal edge sagging means the commanded current is
    # not fully delivered (compliance), the earliest warning before Rₐ drifts.
    current_sag_pct: -15
dashboard:
  host: 0.0.0.0
  port: 8050
  refresh_interval_sec: 10
  # Multi-user serving. The default threaded dev server handles concurrent
  # users fine for a small lab. For heavier load, set use_waitress: true and
  # `pip install waitress` (a production WSGI server that runs on Windows).
  use_waitress: false
  waitress_threads: 8

# Diagnostics. memtrace: opt-in memory-leak tracer. When enabled it logs the top
# memory-GROWTH sites (tracemalloc snapshot diffs) every interval to `logfile`,
# so an unbounded process names its own leaking file:line -- the leak is the line
# with a steady positive size_diff each snapshot. Off by default (tracemalloc
# roughly doubles allocation cost). Enable, restart QCMonitor, wait a few
# intervals, then read memtrace.log. Env QC_MEMTRACE=1 forces it on.
debug:
  memtrace:
    enabled: false
    interval_sec: 120
    top: 20
    frames: 12
    # logfile: D:/code/qc_monitor/memtrace.log   # default: <cwd>/memtrace.log
auth:
  enabled: true
  # Identity method: 'cf_access' (Cloudflare Access, default) or
  # 'google_oauth' (the app runs Google sign-in itself).
  method: google_oauth
  cf_team_domain: ''
  cf_audience: ''
  # dev_bypass short-circuits BOTH methods for local development.
  # Set to false before exposing the dashboard.
  dev_bypass: false
  dev_bypass_email: hoang392@umn.edu
  # --- app-level Google OAuth (used when method: google_oauth) ---
  # 1. Google Cloud Console -> APIs & Services -> Credentials ->
  #    Create OAuth client ID -> Web application.
  # 2. Authorized redirect URI: <oauth_redirect_base>/auth/google/callback
  # 3. Put the client ID below; keep the SECRET out of git -- set env
  #    QC_GOOGLE_CLIENT_SECRET or write it to secrets/google_client_secret.
  google_client_id: 833184028975-eg8co485fvt6gqcr9fkibhoviilsju9q.apps.googleusercontent.com
  allowed_domain: umn.edu
  # Served over Tailscale HTTPS (`tailscale serve --bg 8050`) so Google
  # OAuth accepts the redirect (it rejects raw-IP / http for non-localhost).
  # Everyone reaches the app at this MagicDNS https host (port 443), and the
  # callback https://<host>/auth/google/callback must be registered in the
  # Google OAuth client's Authorized redirect URIs.
  oauth_redirect_base: https://desktop-omq8vr5.tail7d348d.ts.net
